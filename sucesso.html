<!DOCTYPE html>

<head>

  <title>Denúncia enviada — Portal Escolar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <span>Denúncia enviada com sucesso</span>

    <section class="content success-content">
      <div class="success-icon" aria-hidden="true">✓</div>

      <div class="protocol-card">
        <span class="protocol-label">Seu protocolo</span>
        <strong>#BRN-99812</strong>
      </div>
      <p class="help-text">Guarde esse número para acompanhar sua denúncia, se desejar.</p>

      <div class="form-actions success-actions">
        <a class="button button-secondary" href="index.html">Voltar ao início</a>
        <a class="button button-primary" href="denuncia.html">Fazer outro relato</a>

    </section>
