<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova denúncia</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page-shell"><header class="topbar"><a class="back" href="index.html">←</a>Nova denúncia: Detalhes</header>
<section class="content"><p class="eyebrow">FORMULÁRIO DE RELATO</p><h1>Conte o que aconteceu</h1><p class="intro">Preencha as informações abaixo. Não é necessário se identificar.</p>
<form id="reportForm"><div class="form-grid">
<div class="field"><label for="tipo">Tipo de incidente *</label><select id="tipo" name="tipo" required><option value="">Selecione</option><option>Bullying</option><option>Vandalismo</option><option>Ameaça ou violência</option><option>Problema de segurança</option><option>Discriminação</option><option>Outro</option></select></div>
<div class="field"><label for="local">Local</label><input id="local" name="local" placeholder="Ex.: Pátio, sala 12"></div>
<div class="field"><label for="data">Data aproximada</label><input id="data" name="data" type="date"></div>
<div class="field"><label for="hora">Horário aproximado</label><input id="hora" name="hora" type="time"></div></div>
<div class="field"><label for="descricao">Descreva o ocorrido</label><textarea id="descricao" name="descricao" rows="5" placeholder="Conte o que aconteceu. Evite incluir nomes se quiser manter o anonimato."></textarea><small>Não informe seus dados pessoais caso deseje permanecer anônimo.</small></div>
<div class="field"><label for="midia">Anexar mídia (opcional)</label><input id="midia" name="midia" type="file" accept="image/*,video/*"><small>Na demonstração, apenas o nome do arquivo será registrado; o arquivo não será enviado.</small><span id="fileName" class="file-name"></span></div>
<div class="actions"><a class="button secondary" href="index.html">Cancelar</a><button class="button primary" type="submit">Enviar denúncia</button></div></form><p id="formMessage" class="message"></p></section></main><script src="app.js"></script></body></html>
